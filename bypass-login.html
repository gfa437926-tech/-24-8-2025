<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الدخول المباشر</title>
</head>
<body>
    <h2>الدخول المباشر إلى النظام</h2>
    <button onclick="loginAsAdmin()">الدخول كمدير</button>
    <button onclick="loginAsUser()">الدخول كراصد</button>

    <script>
        function loginAsAdmin() {
            localStorage.setItem('loggedIn', 'true');
            localStorage.setItem('username', 'مدير النظام (طوارئ)');
            window.location.href = 'index.html';
        }

        function loginAsUser() {
            localStorage.setItem('loggedIn', 'true');
            localStorage.setItem('username', 'راصد جوي (طوارئ)');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
